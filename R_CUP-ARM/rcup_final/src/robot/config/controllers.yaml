controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
mecanum_controller:
  ros__parameters:
    front_left_wheel_command_joint_name:  "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name:   "back_left_wheel_joint"
    rear_right_wheel_command_joint_name:  "back_right_wheel_joint"
    kinematics:
      wheels_radius: 0.0525
      sum_of_robot_center_projection_on_X_Y_axis: 0.310625
    base_frame_offset:
      x: 0.0
      y: 0.0
      theta: 0.0
    use_stamped_vel: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    reference_timeout: 0.1
arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_controller:
  ros__parameters:
    joints:
      - Jaw
      - Jaw2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity